enabled: false
cron: 0/15 * * * * ?
variables:
  exe: '{{ env "DEV_HOME" }}\Aion\Aion.Npc\bin\Debug\net8.0\Aion.Npc.exe'
steps:
  - script: '{{ var.exe }}'
    args:
      - '--workflow {{ job.name }}'
      - '--trigger {{ job.mode }}'
      - '--cron {{ job.cron ?? "null" }}'
      - '--step {{ step.name ?? "null" }}'
      - '--index {{ step.index }}'
    logStdOut: true
    logStdErr: true