enabled: false
cron: 0/15 * * * * ?
variables:
  exe: '{{ env "DEV_HOME" }}\Aion\Aion.Npc\bin\Debug\net8.0\Aion.Npc.exe'
steps:
  - script: '{{ local.exe }}'
    args:
      - '--app-name {{ app.name }}'
      - '--workflow-name {{ workflow.name }}'
      - '--workflow-mode {{ workflow.mode }}'
      - '--workflow-cron {{ workflow.cron ?? "null" }}'
      - '--step-name {{ step.name ?? "null" }}'
      - '--step-index {{ step.index }}'
    logStdOut: true
    logStdErr: true