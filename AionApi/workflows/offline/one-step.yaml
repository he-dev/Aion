enabled: false
cron: 0/12 * * * * ?
variables:
  exe: '{{ env "DEV_HOME" }}\Aion\AionApi.TestApp\bin\Debug\net8.0\AionApi.TestApp.exe'

steps:
  - script: '{{ var.exe }}'
    args:
      - '--workflow {{ job.name }}'
      - '--trigger {{ job.start }}'
      - '--cron {{ job.cron ?? "N/A" }}'
      - '--step {{ step.name }}'
      - '--index {{ step.index }}'
      - '--sleep 5'
      - '--exit-code 0'
    windowVisible: true
    logStdOut: true
    logStdErr: true